name: CI Pipeline

on:
  push:
    branches: [ main, master, audit/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov bandit ruff

      - name: Run Bandit Security SAST
        run: |
          bandit -r backend -ll -ii

      - name: Run Ruff Linter
        run: |
          ruff check backend --exit-zero

      - name: Seed Database & Run Pytest Suite
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          POSTGRES_URL: sqlite:///./test_ci.db
          CHROMA_PERSIST_DIR: ./ci_chroma_data
        run: |
          python -c "from backend.models.database import create_tables, seed_demo_users; create_tables(); seed_demo_users()"
          pytest --cov=backend --cov-report=term

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Assets
        working-directory: frontend
        run: npm run build
