services:
  # ─── FastAPI Backend Web Service ─────────────────────────────────────────────
  - type: web
    name: language-agnostic-chatbot-backend
    env: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

  # ─── React Frontend Static Site ──────────────────────────────────────────────
  - type: static
    name: language-agnostic-chatbot-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://language-agnostic-chatbot-backend.onrender.com/api/v1
